name: Claude Code Review

# CORE-4303: thin wrapper — model pin + action version live in aiera-workflows.
# Review prompt defaults live in the hub (same text as former direct_prompt).
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, edited]

jobs:
  claude-review:
    uses: aiera-inc/aiera-workflows/.github/workflows/reusable-claude-code-review.yml@main
    secrets: inherit
    with:
      timeout_minutes: 10
    # Org default model is claude-sonnet-4-6 (hub). Override only if needed:
    # with:
    #   model: "claude-opus-4-8"
    # Optional custom review prompt (hub has a sensible default):
    #   prompt: |
    #     Please review this pull request...
