name: Claude Code

# CORE-4303: thin wrapper — model pin + action version live in aiera-workflows.
on:
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: aiera-inc/aiera-workflows/.github/workflows/reusable-claude-assistant.yml@main
    secrets: inherit
    with:
      timeout_minutes: 10
    # Org default model is claude-sonnet-4-6 (hub). Override only if needed:
    # with:
    #   model: "claude-opus-4-8"
